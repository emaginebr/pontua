# Pontua — frontend (SPA + PWA). Copiado para /etc/nginx/conf.d/default.conf (research R-15).
# Serve a SPA e encaminha /api/ e /health para a API (`api:8080`), mantendo app e API na mesma
# origem (sem CORS). O HTTPS, quando houver, fica no proxy na frente deste container.
# Se VITE_SITE_BASENAME for usado (ex.: /pontua), este arquivo precisa de ajuste.

# Esquema original: o do proxy HTTPS na frente (X-Forwarded-Proto) ou o desta conexão
map $http_x_forwarded_proto $pontua_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Cache longo só para respostas de sucesso em /assets/ (um 404 de chunk não pode ficar 1 ano)
map $status $pontua_assets_cache {
    200     "public, max-age=31536000, immutable";
    304     "public, max-age=31536000, immutable";
    default "no-store";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        text/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Cabeçalhos de segurança. Atenção: add_header dentro de um location substitui os do server,
    # por isso o include é repetido nos locations que definem Cache-Control.
    include /etc/nginx/snippets/pontua-security-headers.inc;

    # DNS interno do Docker: resolve `api` na hora da requisição (o nginx sobe mesmo se a API
    # ainda não existir e acompanha a troca de IP quando o container da API é recriado)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Healthcheck do próprio container (não confundir com /health da API)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Arquivos com hash no nome (gerados pelo Vite): cache de 1 ano. 404 de verdade se faltar
    # (um chunk antigo nunca pode receber o index.html como JavaScript).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control $pontua_assets_cache always;
        include /etc/nginx/snippets/pontua-security-headers.inc;
    }

    # Entrada da SPA: sempre revalidar (novas versões aparecem sem limpar cache).
    # Também atende o fallback das rotas da SPA (redirecionamento interno do try_files).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/pontua-security-headers.inc;
    }

    # O mime.types do nginx pode não mapear .webmanifest; o tipo é definido só aqui (um bloco
    # `types` no server substituiria todo o mapa herdado).
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/pontua-security-headers.inc;
    }

    # Service worker e runtime do Workbox: o navegador precisa sempre revalidar para achar versões
    # novas. 404 de verdade se faltar (nunca cair no index.html).
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/pontua-security-headers.inc;
    }

    # robots.txt (copiado no Dockerfile): 404 de verdade se faltar — nunca o index.html da SPA,
    # que o Lighthouse lê como robots.txt inválido (revisão T070, A-23)
    location = /robots.txt {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/pontua-security-headers.inc;
    }

    location ~ ^/workbox-[^/]+\.js$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/pontua-security-headers.inc;
    }

    # --- API na mesma origem -------------------------------------------------------------------
    # proxy_pass com variável repassa a URI original sem alteração.
    location /api/ {
        set $pontua_api http://api:8080;
        proxy_pass $pontua_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pontua_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        # Os cabeçalhos de segurança vêm do server; evita duplicá-los se a API também os enviar
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Permissions-Policy;
    }

    location = /health {
        set $pontua_api http://api:8080;
        proxy_pass $pontua_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pontua_forwarded_proto;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Permissions-Policy;
    }

    location /health/ {
        set $pontua_api http://api:8080;
        proxy_pass $pontua_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $pontua_forwarded_proto;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Permissions-Policy;
    }

    # Rotas da SPA (/historico, /empresa/membros/12…) caem no index.html
    location / {
        try_files $uri /index.html;
    }
}
